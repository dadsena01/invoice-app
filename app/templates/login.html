{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center h-[60vh]">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 border border-gray-100">

        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Welcome Back</h2>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input type="email" id="email"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="admin@example.com" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="password"
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                    placeholder="••••••••" required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 transform hover:scale-[1.02]">
                Sign In
            </button>

            <div id="error-msg"
                class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-center">
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-msg');

        errorDiv.classList.add('hidden');
        errorDiv.innerText = '';

        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = '/customers';
        } else {
            errorDiv.innerText = data.error || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
