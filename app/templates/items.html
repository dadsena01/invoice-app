{% extends "base.html" %} {% block content %}
<div class="mt-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Items Inventory</h1>
    <button
      onclick="document.getElementById('itemModal').classList.remove('hidden')"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg"
    >
      + New Item
    </button>
  </div>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full leading-normal">
      <thead>
        <tr>
          <th
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase"
          >
            ID
          </th>
          <th
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase"
          >
            Item Name
          </th>
          <th
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase"
          >
            Price (₹)
          </th>
          <th
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase"
          >
            Action
          </th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
        <tr>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            <span class="font-bold text-gray-700">#{{ item.id }}</span>
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            {{ item.name }}
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            ₹{{ item.price }}
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            <a
              href="/items/{{ item.id }}/edit"
              class="text-blue-600 hover:text-blue-900 font-bold mr-3"
            >
              Edit
            </a>
            <button
              onclick="deleteItem({{ item.id }})"
              class="text-red-600 hover:text-red-900 font-bold"
            >
              Delete
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<div
  id="itemModal"
  class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full"
>
  <div
    class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white"
  >
    <div class="mt-3 text-center">
      <h3 class="text-lg leading-6 font-medium text-gray-900">Add New Item</h3>

      <form id="addItemForm">
        <div class="mt-2 px-7 py-3">
          <input
            id="new_item_name"
            type="text"
            placeholder="Item Name (e.g. Notebook)"
            required
            class="mb-3 px-3 py-2 border rounded w-full"
          />
          <input
            id="new_item_price"
            type="number"
            min="0"
            step="0.01"
            placeholder="Price (e.g. 50)"
            required
            class="mb-3 px-3 py-2 border rounded w-full"
          />
        </div>

        <div class="items-center px-4 py-3">
          <button
            type="submit"
            class="px-4 py-2 bg-blue-600 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700"
          >
            Save Item
          </button>
          <button
            type="button"
            onclick="
              document.getElementById('itemModal').classList.add('hidden')
            "
            class="mt-2 px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  async function deleteItem(id) {
    if (confirm("Delete this item from inventory?")) {
      const res = await fetch(`/api/items/${id}`, { method: "DELETE" });

      if (res.ok) {
        window.location.reload();
      } else {
        alert("Error deleting item.");
      }
    }
  }

  document
    .getElementById("addItemForm")
    .addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("new_item_name").value;
      const price = document.getElementById("new_item_price").value;

      const response = await fetch("/api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, price: price }),
      });

      if (response.ok) {
        window.location.reload();
      } else {
        alert("Error creating item");
      }
    });
</script>
{% endblock %}
