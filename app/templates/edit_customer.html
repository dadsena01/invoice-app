{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center h-[80vh]">
    <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-8">
        
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Customer</h2>
        
        <form id="editCustomerForm" class="space-y-4">
            <div>
                <label class="block text-gray-600 mb-1 font-medium">Name</label>
                <input type="text" id="name" value="{{ customer.name }}" required
                       class="w-full border px-4 py-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-600 mb-1 font-medium">Email</label>
                <input type="email" id="email" value="{{ customer.email }}" required
                       class="w-full border px-4 py-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-600 mb-1 font-medium">Phone</label>
                <input type="tel" maxlength="15" id="phone" value="{{ customer.phone }}"
                       class="w-full border px-4 py-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-600 mb-1 font-medium">Address</label>
                <textarea id="address" rows="2"
                       class="w-full border px-4 py-2 rounded focus:ring-2 focus:ring-blue-500">{{ customer.address or '' }}</textarea>
            </div>

            <div>
                <label class="block text-gray-600 mb-1 font-medium">GSTIN</label>
                <input type="text" id="gstin" value="{{ customer.gstin or '' }}" maxlength="15"
                       placeholder="e.g. 22AAAAA0000A1Z5"
                       class="w-full border px-4 py-2 rounded font-mono focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="flex gap-4 mt-6">
                <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">
                    Save Changes
                </button>
                <a href="/customers" class="flex-1 bg-gray-200 text-gray-700 text-center font-bold py-2 rounded hover:bg-gray-300">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('editCustomerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            gstin: document.getElementById('gstin').value,
        };

        const response = await fetch('/api/customers/{{ customer.id }}', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            window.location.href = '/customers';
        } else {
            alert('Email already used');
        }
    });
</script>
{% endblock %}
