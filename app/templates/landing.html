{% extends "base.html" %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center text-center">
    
    <h1 class="text-5xl font-extrabold text-gray-900 mb-6">
        Invoice<span class="text-blue-600">Pro</span>
    </h1>
    
    <p class="text-xl text-gray-600 mb-10 max-w-2xl">
        The simplest way to generate invoices and GST billing.
    </p>

    <div class="space-x-4">
        {% if current_user.is_authenticated %}
            <a href="/invoices" 
               class="bg-blue-600 hover:bg-blue-700 text-black font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">
                Go to Dashboard
            </a>
        {% else %}
            <a href="/login" 
               class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105">
                Login to Start
            </a>
        {% endif %}
    </div>
</div>
{% endblock %}
