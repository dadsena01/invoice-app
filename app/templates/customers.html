{% extends "base.html" %} {% block content %}
<div class="mt-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Customers</h1>
    <button
      onclick="
        document.getElementById('createModal').classList.remove('hidden')
      "
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition"
    >
      + New Customer
    </button>
  </div>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="min-w-full leading-normal">
      <thead>
        <tr>
          <th
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase"
          >
            Name
          </th>
          <th
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase"
          >
            Email
          </th>
          <th
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase"
          >
            Phone
          </th>
          <th
            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase"
          >
            Actions
          </th>
        </tr>
      </thead>
      <tbody>
        {% for customer in customers %}
        <tr>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            <span class="font-bold text-gray-700">{{ customer.name }}</span>
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            {{ customer.email }}
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            {{ customer.phone }}
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            <a
              href="/customers/{{ customer.id }}/edit"
              class="text-blue-600 hover:text-blue-900 font-bold mr-3"
            >
              Edit
            </a>
            <button
              onclick="deleteCustomer({{ customer.id }})"
              class="text-red-600 hover:text-red-900 font-bold"
            >
              Delete
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<div
  id="createModal"
  class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full"
>
  <div
    class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white"
  >
    <div class="mt-3 text-center">
      <h3 class="text-lg leading-6 font-medium text-gray-900">Add Customer</h3>

      <form id="createCustomerForm">
        <div class="mt-2 px-7 py-3">
          <input
            id="new_name"
            type="text"
            placeholder="Name"
            required
            class="mb-3 px-3 py-2 border rounded w-full"
          />

          <input
            id="new_email"
            type="email"
            placeholder="Email"
            required
            class="mb-3 px-3 py-2 border rounded w-full"
          />

          <input
            id="new_phone"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            placeholder="Phone"
            class="mb-3 px-3 py-2 border rounded w-full"
          />
        </div>

        <div class="items-center px-4 py-3">
          <button
            type="submit"
            class="px-4 py-2 bg-blue-600 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700"
          >
            Save
          </button>
          <button
            type="button"
            onclick="
              document.getElementById('createModal').classList.add('hidden')
            "
            class="mt-2 px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  async function deleteCustomer(id) {
    if (confirm("Are you sure you want to delete?")) {
      const res = await fetch(`/api/customers/${id}`, { method: "DELETE" });

      if (res.ok) {
        window.location.reload();
      } else {
        alert("Error deleting customer.");
      }
    }
  }

  document
    .getElementById("createCustomerForm")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("new_name").value;
      const email = document.getElementById("new_email").value;
      const phone = document.getElementById("new_phone").value;

      const response = await fetch("/api/customers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, phone }),
      });

      if (response.ok) {
        window.location.reload();
      } else {
        alert("Error creating customer!");
      }
    });
</script>
{% endblock %}
