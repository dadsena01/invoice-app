{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center h-[60vh]">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Item</h2>
        
        <form id="editItemForm" class="space-y-4">
            <div>
                <label class="block text-gray-600 mb-1 font-medium">Item Name</label>
                <input type="text" required id="name" value="{{ item.name }}"
                       class="w-full border px-4 py-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-gray-600 mb-1 font-medium">Price (₹)</label>
                <input type="number" min="0" required id="price" value="{{ item.price }}"
                       class="w-full border px-4 py-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="flex gap-4 mt-6">
                <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">
                    Save Changes
                </button>
                <a href="/items" class="flex-1 bg-gray-200 text-gray-700 text-center font-bold py-2 rounded hover:bg-gray-300">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('editItemForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            name: document.getElementById('name').value,
            price: document.getElementById('price').value
        };

        const response = await fetch('/api/items/{{ item.id }}', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            window.location.href = '/items';
        } else {
            alert('Error updating item');
        }
    });
</script>
{% endblock %}
