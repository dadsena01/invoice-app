{% extends "base.html" %}

{% block content %}
<div class="mt-8 max-w-xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Business Settings</h1>

    <div class="bg-white rounded-lg shadow p-8">
        <form id="settingsForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Business Name</label>
                <input id="business_name" type="text" value="{{ settings.business_name }}"
                    class="w-full border rounded px-3 py-2" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">GSTIN</label>
                <input id="gstin" type="text" value="{{ settings.gstin or '' }}" maxlength="15"
                    placeholder="e.g. 22AAAAA0000A1Z5"
                    class="w-full border rounded px-3 py-2 font-mono">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Address</label>
                <textarea id="address" rows="3"
                    class="w-full border rounded px-3 py-2">{{ settings.address or '' }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Invoice Number Prefix</label>
                <input id="invoice_prefix" type="text" value="{{ settings.invoice_prefix }}" maxlength="10"
                    placeholder="e.g. INV"
                    class="w-full border rounded px-3 py-2">
                <p class="text-xs text-gray-400 mt-1">Invoices will be numbered: {{ settings.invoice_prefix }}-2026-0001</p>
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded mt-4">
                Save Settings
            </button>
        </form>
        <p id="msg" class="text-green-600 text-sm mt-3 hidden text-center">Settings saved!</p>
    </div>
</div>

<script>
    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const response = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                business_name: document.getElementById('business_name').value,
                gstin: document.getElementById('gstin').value,
                address: document.getElementById('address').value,
                invoice_prefix: document.getElementById('invoice_prefix').value,
            })
        });
        if (response.ok) {
            const msg = document.getElementById('msg');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        } else {
            alert("Error saving settings.");
        }
    });
</script>
{% endblock %}
