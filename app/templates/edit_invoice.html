{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-lg shadow-lg">
    <div class="mb-6">
        <a href="/invoices/{{ invoice.id }}" class="text-sm text-gray-500 hover:text-blue-600">← Back to Invoice #{{ invoice.id }}</a>
        <h2 class="text-2xl font-bold text-gray-800 mt-1">Edit Invoice #{{ invoice.id }}</h2>
    </div>

    <div id="item-data-store" style="display:none;">
        {% for i in items %}
        <div data-id="{{ i.id }}" data-name="{{ i.name }}" data-price="{{ i.price }}"></div>
        {% endfor %}
    </div>

    <div id="existing-items-store" style="display:none;">
        {% for li in invoice.items %}
        <div data-item-name="{{ li.item_name }}" data-item-price="{{ li.item_price }}" data-qty="{{ li.quantity }}"></div>
        {% endfor %}
    </div>

    <form id="invoiceForm">
        <div class="grid grid-cols-2 gap-6 mb-8">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Customer</label>
                <select id="customer_id" class="w-full border p-2 rounded">
                    {% for c in customers %}
                    <option value="{{ c.id }}" {% if c.id == invoice.customer_id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Tax Type</label>
                    <select id="tax_type" class="w-full border p-2 rounded">
                        <option value="GST" {% if invoice.tax_type == 'GST' %}selected{% endif %}>GST</option>
                        <option value="IGST" {% if invoice.tax_type == 'IGST' %}selected{% endif %}>IGST</option>
                        <option value="CGST+SGST" {% if invoice.tax_type == 'CGST+SGST' %}selected{% endif %}>CGST+SGST</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Tax Rate (%)</label>
                    <input type="number" id="tax_rate" value="{{ invoice.tax_rate }}" class="w-full border p-2 rounded" onchange="calculateTotal()">
                </div>
            </div>
        </div>

        <h3 class="text-xl font-semibold mb-4 text-gray-700">Items</h3>
        <table class="w-full mb-6">
            <thead>
                <tr class="bg-gray-100 text-left">
                    <th class="p-3">Item</th>
                    <th class="p-3 w-24">Price</th>
                    <th class="p-3 w-24">Qty</th>
                    <th class="p-3 w-32">Total</th>
                    <th class="p-3 w-10"></th>
                </tr>
            </thead>
            <tbody id="items-body"></tbody>
        </table>

        <button type="button" onclick="addItemRow()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded mb-8">
            + Add Item
        </button>

        <div class="flex justify-end">
            <div class="w-64">
                <div class="flex justify-between mb-2">
                    <span>Subtotal:</span>
                    <span id="display-subtotal" class="font-bold">₹0.00</span>
                </div>
                <div class="flex justify-between mb-2 text-red-600">
                    <span>Tax:</span>
                    <span id="display-tax" class="font-bold">₹0.00</span>
                </div>
                <div class="flex justify-between border-t pt-2 text-xl">
                    <span>Total:</span>
                    <span id="display-total" class="font-bold">₹0.00</span>
                </div>
            </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded mt-8">
            Save Changes
        </button>
    </form>
</div>

<script>
    const availableItems = [];
    document.querySelectorAll('#item-data-store div').forEach(div => {
        availableItems.push({
            id: div.getAttribute('data-id'),
            name: div.getAttribute('data-name'),
            price: parseFloat(div.getAttribute('data-price'))
        });
    });

    function buildOptions(selectedName) {
        return availableItems.map(item =>
            `<option value="${item.id}" data-price="${item.price}" ${item.name === selectedName ? 'selected' : ''}>${item.name}</option>`
        ).join('');
    }

    function addItemRow(selectedName = null, price = null, qty = 1) {
        if (availableItems.length === 0) { alert("No items available!"); return; }
        const defaultItem = selectedName ? availableItems.find(i => i.name === selectedName) || availableItems[0] : availableItems[0];
        const displayPrice = price !== null ? price : defaultItem.price;

        const tbody = document.getElementById('items-body');
        const row = document.createElement('tr');
        row.className = "border-b";
        row.innerHTML = `
            <td class="p-2"><select class="item-select w-full border p-1 rounded" onchange="updatePrice(this)">${buildOptions(selectedName || defaultItem.name)}</select></td>
            <td class="p-2"><input type="text" class="price-display w-full bg-gray-50 border-0 p-1" value="${displayPrice}" disabled></td>
            <td class="p-2"><input type="number" class="qty-input w-full border p-1" value="${qty}" min="1" onchange="calculateTotal()"></td>
            <td class="p-2 font-bold row-total">₹${displayPrice * qty}</td>
            <td class="p-2 text-red-500 cursor-pointer font-bold" onclick="deleteRow(this)">x</td>
        `;
        tbody.appendChild(row);
        calculateTotal();
    }

    function deleteRow(btn) { btn.parentElement.remove(); calculateTotal(); }

    function updatePrice(select) {
        const price = select.options[select.selectedIndex].getAttribute('data-price');
        select.closest('tr').querySelector('.price-display').value = price;
        calculateTotal();
    }

    function calculateTotal() {
        let subtotal = 0;
        document.querySelectorAll('#items-body tr').forEach(row => {
            const price = parseFloat(row.querySelector('.price-display').value);
            const qty = parseInt(row.querySelector('.qty-input').value);
            const lineTotal = price * qty;
            row.querySelector('.row-total').innerText = "₹" + lineTotal;
            subtotal += lineTotal;
        });
        const taxRate = parseFloat(document.getElementById('tax_rate').value) || 0;
        const taxAmount = subtotal * (taxRate / 100);
        document.getElementById('display-subtotal').innerText = "₹" + subtotal;
        document.getElementById('display-tax').innerText = "₹" + taxAmount.toFixed(2);
        document.getElementById('display-total').innerText = "₹" + (subtotal + taxAmount).toFixed(2);
    }

    document.getElementById('invoiceForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const items = [];
        document.querySelectorAll('#items-body tr').forEach(row => {
            items.push({
                item_id: row.querySelector('.item-select').value,
                quantity: row.querySelector('.qty-input').value
            });
        });
        const response = await fetch('/api/invoices/{{ invoice.id }}', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customer_id: document.getElementById('customer_id').value,
                tax_type: document.getElementById('tax_type').value,
                tax_rate: document.getElementById('tax_rate').value,
                items
            })
        });
        if (response.ok) {
            window.location.href = "/invoices/{{ invoice.id }}";
        } else {
            alert("Error saving. Please try again.");
        }
    });

    window.onload = function() {
        const existing = document.querySelectorAll('#existing-items-store div');
        if (existing.length > 0) {
            existing.forEach(div => {
                addItemRow(
                    div.getAttribute('data-item-name'),
                    parseFloat(div.getAttribute('data-item-price')),
                    parseInt(div.getAttribute('data-qty'))
                );
            });
        } else {
            addItemRow();
        }
    };
</script>
{% endblock %}
